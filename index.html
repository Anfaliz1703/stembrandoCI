async function snapshot(){const [s,p,r,a]=await Promise.all([sb.from('sessions').select('*').eq('room',room).maybeSingle(),sb.from('participants').select('*').eq('room',room).order('created_at'),sb.from('responses').select('*').eq('room',room).order('created_at'),sb.from('approvals').select('*').eq('room',room).order('created_at')]);const participants=p.data||[],responses=r.data||[],approvals=a.data||[];const sm=new Map(participants.map(x=>[x.id,{...x,score:0,correct:0,responses:0}]));responses.forEach(x=>{const q=sm.get(x.participant_id);if(q){q.score+=Number(x.points||0);q.responses++;if(x.correct===true)q.correct++}});return{session:s.data,participants,responses,approvals,leaderboard:[...sm.values()].sort((a,b)=>b.score-a.score||b.correct-a.correct||a.name.localeCompare(b.name))}}

async function renderPresenter(){await ensureSession();app.innerHTML=`<main class="presenter"><div class="presenter-grid"><section class="stage-card"><div class="stage-toolbar"><span class="pill">Sala <b>${room}</b></span><span class="pill"><b id="slideCount">1/${SLIDES.length}</b></span><span class="pill timer" id="timer">00:00</span><button class="btn btn-soft" id="startTimer">Iniciar reloj</button><span style="margin-left:auto" class="muted" id="active">Sin dinámica activa</span></div><div class="progress"><i id="prog"></i></div><div id="stage"></div></section><aside class="side"><div class="side-card qr-card"><h3>Participa desde el celular</h3><div class="qr" id="qr"></div><div id="audUrl" class="urlbox"></div><button class="btn btn-soft w100" id="copyUrl" style="margin-top:8px">Copiar enlace</button></div><div class="side-card"><h3>Control</h3><div class="controls"><button class="btn btn-soft" id="prev">← Anterior</button><button class="btn btn-blue" id="next">Siguiente →</button><button class="btn btn-green" id="open">Abrir dinámica</button><button class="btn btn-soft" id="close">Cerrar dinámica</button></div></div><div class="side-card"><h3>Participantes <span id="pcount">0</span></h3><div class="people" id="people"></div></div><div class="side-card"><h3>Top en vivo</h3><div id="rank" class="rank"></div></div><div class="side-card"><h3>Notas del expositor</h3><div id="notes" class="notes"></div></div><div class="side-card"><h3>Mantenimiento</h3><button class="btn btn-danger w100" onclick="resetRoom()">Reiniciar sala</button><button class="btn btn-soft w100" style="margin-top:8px" onclick="localStorage.removeItem('stembrando-supabase');location.href=location.pathname+'?view=presenter'">Cambiar Supabase</button></div></aside></div></main>`;buildQR();$('#copyUrl').onclick=async()=>{await navigator.clipboard.writeText(audienceUrl());$('#copyUrl').textContent='Copiado'};$('#startTimer').onclick=()=>{timerStart=Date.now();runTimer()};$('#prev').onclick=()=>changeSlide(-1);$('#next').onclick=()=>changeSlide(1);$('#open').onclick=openInteraction;$('#close').onclick=()=>setInteraction(null);subscribe(refreshPresenter);await refreshPresenter();window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')changeSlide(1);if(e.key==='ArrowLeft')changeSlide(-1);if(e.key.toLowerCase()==='i')openInteraction()})}

async function renderAudience(){await ensureSession();app.innerHTML=`<main class="audience"><section id="login" class="aud-card"><div class="eyebrow">Sala ${room}</div><h2>Únete a STEMbrando Live</h2><p class="muted">Crea un perfil rápido para participar en preguntas, nubes y ranking.</p><form id="join" class="form"><div class="field"><label>Nombre</label><input name="name" required maxlength="40" placeholder="Tu nombre"></div><div class="field"><label>Rol / área</label><input name="role" maxlength="40" placeholder="Docente, coordinador, área…"></div><div class="field"><label>Sede</label><select name="sede"><option>El Recreo</option><option>Filo de Platanares</option><option>Otra sede / invitado</option></select></div><div class="field"><label>Avatar</label><div class="avatar-grid" id="avatars">${['🌱','🎓','💡','🚀','🤖','⭐','☕','🧠'].map((x,i)=>`<button type="button" class="avatar ${i===0?'active':''}" data-a="${x}">${x}</button>`).join('')}</div></div><button class="btn btn-blue w100">Entrar</button></form></section><section id="live" class="hidden"><div class="aud-card" id="slideInfo"></div><div class="aud-card interaction" id="interaction"></div><div class="aud-card"><h2>Top en vivo</h2><div class="rank" id="miniRank"></div></div></section></main>`;$$('.avatar').forEach(b=>b.onclick=()=>{avatar=b.dataset.a;$$('.avatar').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('#join').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.currentTarget));await joinParticipant(p);$('#login').classList.add('hidden');$('#live').classList.remove('hidden');await refreshAudience()};const saved=JSON.parse(localStorage.getItem(`stem-profile-${room}`)||'null');if(saved?.name){await joinParticipant(saved);$('#login').classList.add('hidden');$('#live').classList.remove('hidden')}subscribe(refreshAudience);await refreshAudience();setInterval(()=>participant&&sb.from('participants').update({last_seen:nowIso()}).eq('id',participant.id),12000)}
function remember(id){submitted.add(id);localStorage.setItem(`stem-sub-${room}`,JSON.stringify([...submitted]))}
async function submitResponse(inter,response){const ms=Math.max(0,Date.now()-(inter.opened_at||Date.now()));let correct=null,points=0;if(inter.type==='quiz'){correct=Number(response)===Number(inter.correct);if(correct)points=Math.max(250,1000-Math.floor(ms/35))}if(inter.type==='word')points=60;const r=await sb.from('responses').insert({id:uid(),room,participant_id:participant.id,interaction_id:inter.id,type:inter.type,response:String(response),correct,ms,points,meta:{},created_at:nowIso()});if(r.error)throw r.error;remember(inter.id);return{correct}}
async function submitApproval(inter){const r=await sb.from('approvals').upsert({id:uid(),room,participant_id:participant.id,interaction_id:inter.id,approved:true,created_at:nowIso()},{onConflict:'room,participant_id,interaction_id'});if(r.error)throw r.error;remember(inter.id)}
async function refreshAudience(){if(!participant)return;currentSnap=await snapshot();const idx=currentSnap.session?.slide_index||0,s=SLIDES[idx],inter=currentSnap.session?.active_interaction;$('#slideInfo').innerHTML=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2>${esc(s.title)}</h2><p class="muted">${esc(s.subtitle)}</p>`;$('#miniRank').innerHTML=renderRank(currentSnap.leaderboard,5);renderInteraction(inter)}
function renderInteraction(inter){const box=$('#interaction');if(!box)return;if(!inter){box.innerHTML='<h2>Esperando dinámica…</h2><p class="muted">Observa la presentación. Cuando el expositor active una pregunta, aparecerá aquí.</p>';return}if(submitted.has(inter.id)){box.innerHTML='<h2>Respuesta recibida</h2><div class="notice">Tu participación ya fue registrada para esta dinámica.</div>';return}if(inter.type==='word'){box.innerHTML=`<h3>${esc(inter.prompt)}</h3><div class="text-answer"><input id="word" maxlength="54" placeholder="Una palabra o frase corta"><button class="btn btn-blue" id="sendWord">Enviar</button></div>`;$('#sendWord').onclick=async()=>{const v=$('#word').value.trim();if(!v)return;await submitResponse(inter,v);renderInteraction(inter)}}if(inter.type==='approval'){box.innerHTML=`<h3>${esc(inter.prompt)}</h3><button class="btn btn-green w100" id="yes">Sí, avancemos</button>`;$('#yes').onclick=async()=>{await submitApproval(inter);renderInteraction(inter)}}if(inter.type==='quiz'){box.innerHTML=`<h3>${esc(inter.prompt)}</h3><div class="answers">${inter.options.map((o,i)=>`<button data-v="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`).join('')}</div><div class="notice">También cuenta la velocidad.</div>`;$$('.answers button',box).forEach(b=>b.onclick=async()=>{$$('.answers button',box).forEach(x=>x.disabled=true);b.classList.add('sel');const r=await submitResponse(inter,b.dataset.v);box.insertAdjacentHTML('beforeend',`<div class="notice ${r.correct?'':'warn'}">${r.correct?'Correcto. Puntaje registrado.':'Respuesta registrada.'}</div>`);setTimeout(()=>renderInteraction(inter),800)})}}
function renderSetup(){
app.innerHTML=`<main class="audience"><section class="aud-card"><div class="eyebrow">Configuración del presentador</div><h2>Conectar STEMbrando Live con Supabase</h2><p class="muted">Esta configuración se guarda solamente en este navegador. La URL y la Publishable key son datos públicos del cliente; nunca uses una Secret key.</p><form id="setupForm" class="form"><div class="field"><label>Project URL</label><input name="url" required placeholder="https://xxxx.supabase.co" value="${esc(CFG.supabaseUrl)}"></div><div class="field"><label>Publishable key</label><input name="key" required placeholder="sb_publishable_..." value="${esc(CFG.supabasePublishableKey)}"></div><button class="btn btn-blue w100">Guardar y abrir presentador</button></form><div class="notice">Después, el QR incluirá automáticamente esta configuración para que los celulares entren sin configurar nada.</div></section></main>`;
$('#setupForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const cfg={supabaseUrl:String(f.get('url')).trim(),supabasePublishableKey:String(f.get('key')).trim()};localStorage.setItem('stembrando-supabase',JSON.stringify(cfg));const u=new URL(location.href);u.search='';u.searchParams.set('view','presenter');location.href=u.href};
}
async function boot(){try{if(!hasConfig){setModePill(false);if(view==='audience'){app.innerHTML=`<main class="audience"><div class="aud-card"><div class="eyebrow">Enlace incompleto</div><h2>Este acceso no contiene la conexión en vivo</h2><p class="muted">Ingresa escaneando el QR generado por el presentador.</p></div></main>`;return}renderSetup();return}setModePill(true);if(view==='home')home();else if(view==='presenter')await renderPresenter();else if(view==='audience')await renderAudience();else home()}catch(e){console.error(e);setModePill(false);app.innerHTML=`<main class="audience"><div class="aud-card"><h2>No se pudo conectar con Supabase</h2><p class="muted">${esc(e.message||e)}</p><div class="notice warn">Verifica la URL, la Publishable key y que las tablas estén creadas en Supabase.</div><button class="btn btn-soft w100" style="margin-top:10px" onclick="localStorage.removeItem('stembrando-supabase');location.href=location.pathname+'?view=presenter'">Cambiar configuración</button></div></main>`}}
boot();
</script>
</body>
</html>
